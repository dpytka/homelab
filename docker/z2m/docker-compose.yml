services:
    zigbee2mqtt:
        container_name: zigbee2mqtt
        image: ghcr.io/koenkk/zigbee2mqtt:2.10.1
        restart: unless-stopped
        volumes:
            - /usr/share/zigbee2mqtt:/app/data
        #     - /run/udev:/run/udev:ro
        ports:
            # Frontend port
            - 8080:8080
        environment:
            - TZ=Europe/Warsaw
